<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Generate QR codes for URLs, Wi-Fi, text, and saved business cards — fully offline." />
    <title>QR Web App</title>
    <script>
      // Apply saved light/dark and controls choices before first paint (no flash).
      // Mirrors src/theme.ts and src/controls.ts — keep the storage keys in sync.
      try {
        var t = localStorage.getItem('qrwebapp.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        // One-hand controls mode — mirrors src/controls.ts.
        if (localStorage.getItem('qrwebapp.controls') === 'bottom') document.documentElement.dataset.controls = 'bottom';
      } catch (e) {}
    </script>
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
